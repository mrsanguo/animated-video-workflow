name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile scripts
        run: >-
          python -m py_compile
          skills/animated-video-workflow/scripts/analyze_subject.py
          skills/animated-video-workflow/scripts/inspect_inputs.py
          skills/animated-video-workflow/scripts/validate_plan.py
          skills/animated-video-workflow/scripts/verify_outputs.py
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
